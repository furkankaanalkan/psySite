{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psk. Elif Nihan Alkan</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'main_Page/style.css' %}">
</head>
<body>

    {% block navbar %}
        <nav class="navbar navbar-expand-lg fixed-top modern-navbar" data-aos="fade-down" data-aos-duration="800">
            <div class="container-fluid px-lg-4">
                <!-- Logo -->
                <a class="navbar-brand fw-bold" href="#">
                    Psk. Elif Nihan
                </a>
                
                <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto align-items-center mt-3 mt-lg-0">
                        <li class="nav-item"><a class="nav-link px-3" href="#services">Çalışma Alanlarım</a></li>
                        <li class="nav-item"><a class="nav-link px-3" href="#approach">Terapi Yaklaşımım</a></li>
                        <li class="nav-item"><a class="nav-link px-3" href="#about">Hakkımda</a></li>
                        <li class="nav-item"><a class="nav-link px-3" href="#contact">İletişim</a></li>
                    </ul>

                    <div class="d-flex align-items-center mt-3 mt-lg-0">
                        <a class="btn btn-primary rounded-pill px-4 py-2 shadow-sm" href="{% url 'payment:pay' %}">Randevu Al</a>
                    </div>
                </div>
            </div>
        </nav>
    {% endblock %}
    
    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            once: true,
            offset: 100,
            duration: 800,
            easing: 'ease-out-cubic'
        });

        window.addEventListener('scroll', function() {
            const navbar = document.querySelector('.modern-navbar');
            if (navbar) {
                if (window.scrollY > 50) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            }
        });
    </script>
</body>
</html>
